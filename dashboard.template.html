<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retail Sales & Returns Analytics</title>
<style>
:root{--accent:#28684d;color:#182a26;background:#f2f5f4;font:16px/1.5 system-ui,sans-serif}
body{margin:0} main{max-width:1080px;margin:auto;padding:clamp(18px,5vw,68px)}
header{background:#182a26;color:white;padding:clamp(20px,4vw,44px);border-radius:20px}
.eyebrow{color:#b9e1cf;text-transform:uppercase;letter-spacing:.15em;font-size:.76rem;font-weight:700}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.02;margin:.45em 0}
h2{font-size:1.25rem;margin-top:0} section{margin-top:20px;background:white;border-radius:16px;padding:clamp(16px,3vw,30px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-top:20px}
.cards div{padding:16px;background:white;border-bottom:3px solid var(--accent);border-radius:12px}
.cards span{display:block;color:#4b6159;font-size:.82rem}.cards strong{font-size:1.35rem}
.bar-row{display:grid;grid-template-columns:7rem 1fr 6.5rem;gap:10px;align-items:center;margin:12px 0;font-size:.88rem}
.track{background:#e7edeb;border-radius:12px;height:14px}.track i{display:block;background:var(--accent);height:100%;border-radius:12px}
.scroll{overflow-x:auto;margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px;text-align:left;border-bottom:1px solid #dbe5e0} th{background:#edf4f1}
footer{color:#4b6159;margin:24px 0;font-size:.85rem}
@media(max-width:450px){.bar-row{grid-template-columns:5.8rem 1fr 5.4rem;gap:5px;font-size:.75rem}}
</style>
<main><header><div class="eyebrow">Data analyst portfolio / synthetic data</div><h1>Retail Sales & Returns Analytics</h1><p>Which categories drive net revenue, and where do refunds erode it?</p></header>
<div class="cards">@CARDS@</div>
<section><h2>Monthly net revenue</h2>@BARS@</section>
<section><h2>Findings</h2><ul>@INSIGHTS@</ul></section>
<section><h2>Breakdown</h2>@TABLES@</section>
<footer>Reproducible portfolio demo. All records are synthetic.</footer></main></html>
